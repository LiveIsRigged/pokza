<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA / raccourci écran d'accueil iOS. `default` = barre d'état système classique (bande
         blanche, heure noire) : look neutre pour la bêta. Le natif (stores) permettra un haut
         parchemin avec heure noire — impossible en PWA iOS, d'où ce choix temporaire. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pokza" />
    <meta name="application-name" content="Pokza" />
    <meta name="theme-color" content="#EDEAE2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
        `--hauteur-app` : posée sur <html> par `src/web/AjusteurHauteur.tsx` pendant qu'un clavier
        virtuel est à l'écran, et retirée dès qu'il s'en va. Sans elle, `100%` reprend la main et le
        comportement est exactement celui d'avant — c'est ce qui rend ce correctif annulable.

        Pourquoi : le clavier iOS ne rétrécit PAS la fenêtre de mise en page (`innerHeight` reste à
        932 px) mais seulement la bande visible (`visualViewport.height` tombe à 569 px). À `100%`,
        l'app fait donc 932 px de haut dans une bande de 569 px, et Safari fait glisser la page
        ENTIÈRE vers le bas pour révéler le champ focalisé. Calée sur la bande visible, l'app n'a
        plus rien sous le bord de l'écran, donc Safari n'a plus rien à révéler. Les mesures et les
        garde-fous sont dans `src/web/hauteurVisible.ts`.

        Les DEUX règles doivent la lire : c'est la hauteur du DOCUMENT qui autorise le glissement,
        pas celle de la seule racine React.
      */
      html,
      body {
        height: var(--hauteur-app, 100%);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /*
        PAS DE ZOOM AU DOUBLE-TAP — signalé par Victor le 02/09/2026, sur iPhone uniquement.
        Taper vite deux cartes voisines du sélecteur (le 8♥ puis le 9♥, distants de 27 px) faisait
        annuler la PREMIÈRE : le second toucher était livré à la carte déjà choisie, qui se
        désélectionnait. On se retrouvait sans aucune carte.

        Safari garde un geste « double-tap pour zoomer » en réserve pendant ~300 ms après un
        toucher. Deux appuis rapprochés dans le temps ET dans l'espace en sont un candidat, et le
        second clic est alors retardé, fusionné ou réattribué. `react-native-web` pose déjà
        `touch-action: manipulation` sur chaque `Pressable`, ce qui neutralise le geste QUAND LES
        DEUX APPUIS SONT SUR LE MÊME élément — mais pas quand ils sont sur deux voisins, car la
        reconnaissance se fait alors plus haut dans l'arbre. Posé ici, sur `body`, il couvre toute
        chaîne d'ancêtres : `touch-action` se compose en descendant, donc plus aucun double-tap
        n'est candidat au zoom, où qu'il tombe.

        `manipulation` et non `none` : le défilement d'un doigt ET LE ZOOM À DEUX DOIGTS restent
        intacts. Seul le zoom au double-tap disparaît — celui dont personne ne se sert dans une app
        et qui, ici, mange un toucher sur deux.
      */
      body {
        touch-action: manipulation;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: var(--hauteur-app, 100%);
        flex: 1;
      }
      /*
        LES FEUILLES ET LES MODALES ÉCHAPPENT À `#root`, IL FAUT LES BORNER À PART.
        `react-native-web` monte chaque `Modal` dans un `<div>` accroché directement à `<body>`, et
        son calque est `position: fixed; top:0; right:0; bottom:0; left:0` (cf.
        `react-native-web/dist/exports/Modal/ModalContent.js`). Un élément `fixed` se dimensionne
        sur la fenêtre de MISE EN PAGE, pas sur son parent : rétrécir `<html>` ne l'atteint donc
        pas, et les cinq feuilles qui contiennent un champ (fiche d'un joueur, signalement,
        commentaires, choix du pays, GIF) auraient gardé le défaut.

        `bottom: auto` explicite ce que le navigateur ferait de toute façon : `top`, `bottom` et
        `height` tous les trois posés, c'est `bottom` qui saute (CSS 2.1 §10.6.4). On préfère le
        dire que s'appuyer sur une règle de résolution de conflit. Sans la variable, `height: 100%`
        se résout sur cette même fenêtre de mise en page et redonne exactement la hauteur d'avant.

        Aucun risque de ressusciter une feuille fermée : `ModalAnimation` ne rend rien du tout tant
        qu'elle est invisible (`isRendering || visible ? … : null`), donc l'élément que ce sélecteur
        vise n'existe même pas à ce moment-là.

        `html` en tête du sélecteur, uniquement pour le poids : `react-native-web` injecte ses
        règles (`.r-bottom-1p0dtai { bottom: 0 }`) dans une feuille ajoutée APRÈS celle-ci, et une
        classe seule l'emporterait à égalité de spécificité.
      */
      html [aria-modal='true'] {
        bottom: auto;
        height: var(--hauteur-app, 100%);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
